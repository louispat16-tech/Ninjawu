<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Niveau 1 - Ninjawu</title>
</head>
<body class="body-niveau">

    <h1>Niveau 1</h1>

    <!-- Le cadre du niveau de jeu -->
    <div class="zone-jeu">
        <!-- Les boutons tactiles pour téléphone / tablette -->
<div class="controles-tactiles">
    <button class="btn-controle" id="btn-gauche">⬅️</button>
    <button class="btn-controle" id="btn-droite">➡️</button>
    <button class="btn-controle" id="btn-saut">⬆️ Saut</button>
    <button class="btn-controle" id="btn-accroupir">⬇️ Bas</button>
</div>

        <!-- APRÈS (avec ton image de ninja) -->
<img src="ninja.png" alt="Ninja" class="ninja" id="joueur">

        <!-- Les plateformes -->
        <div class="plateforme p1"></div>
        <div class="plateforme p2"></div>
        <div class="plateforme p3"></div>
        <div class="plateforme p4"></div>
        
        <!-- Un coffre -->
        <div class="coffre">🪙</div>

        <!-- La sortie (en bas à droite) -->
        <div class="sortie">🚪</div>
    </div>

    <a href="index.html" class="bouton-retour">Retour à l'accueil</a>

</body>
</html>
